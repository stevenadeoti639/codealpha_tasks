name: DevOps Operations Tracker CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test and Package
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Task3_Java_Gradle_Application

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and run tests
        run: ./gradlew build

      - name: Inspect packaged JAR
        run: |
          ls -lh build/libs/
          du -h build/libs/devops-operations-tracker-0.0.1-SNAPSHOT.jar

      - name: Upload application JAR
        uses: actions/upload-artifact@v4
        with:
          name: devops-operations-tracker
          path: Task3_Java_Gradle_Application/build/libs/devops-operations-tracker-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 7
